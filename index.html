<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-DRAMA DATABASE | Korean Drama Guide</title>
<style>
:root{
  --bg:#f7f5f2; --card:#fff; --text:#202020; --muted:#777;
  --line:#e7e2dc; --accent:#8f6a5b; --accent2:#efe5df;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Sans",sans-serif}
header{padding:56px 20px 44px;background:#fff;border-bottom:1px solid var(--line)}
.hero{max-width:1100px;margin:auto}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:700}
h1{font-size:clamp(34px,7vw,64px);line-height:1;margin:12px 0}
.sub{color:var(--muted);font-size:15px}
main{max-width:1100px;margin:0 auto;padding:28px 20px 70px}
.searchbar{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:14px;position:sticky;top:0;z-index:20;box-shadow:0 8px 25px rgba(0,0,0,.06);backdrop-filter:blur(10px)}
.filtersPanel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px;box-shadow:0 8px 25px rgba(0,0,0,.04)}
.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:16px;outline:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer;font-size:13px}
button.active{background:var(--text);color:#fff;border-color:var(--text)}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:24px 2px 12px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;min-height:150px;transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,0,0,.06)}
.year{font-size:12px;color:var(--muted)}
.title{font-size:18px;font-weight:700;line-height:1.45;margin:7px 0 10px}
.type{display:inline-block;background:var(--accent2);color:var(--accent);font-size:11px;padding:4px 8px;border-radius:999px;margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;color:#666;border:1px solid var(--line);padding:3px 7px;border-radius:999px}
.empty{padding:50px 10px;text-align:center;color:var(--muted)}
footer{max-width:1100px;margin:0 auto;padding:0 20px 50px;color:#999;font-size:12px}
.note{margin-top:12px;color:#999;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="hero">
    <div class="eyebrow">K-DRAMA DATABASE / PROTOTYPE</div>
    <h1>韓ドラを、もっと探しやすく。</h1>
    <div class="sub">年代・ジャンル・作品の特徴から韓国ドラマを探すためのデータベース</div>
  </div>
</header>

<main>
  <section class="controls">
    <div style="display:flex;gap:8px"><input id="search" class="search" type="search" placeholder="作品名を検索…"><button id="searchBtn" style="white-space:nowrap;border-radius:12px;padding:0 18px;background:#202020;color:#fff;border-color:#202020">検索</button></div>
    <div id="yearFilters" class="filters"></div>
    <div id="typeFilters" class="filters"></div>
    <div id="tagFilters" class="filters"></div>
    <div class="note">※ 現在はスプレッドシートの初期データから作った試作品。特徴・類似作品はこれから追加できます。</div>
  </section>

  <div class="meta">
    <span id="count"></span>
    <span>初期登録作品</span>
  </div>
  <section id="grid" class="grid"></section>
  <div id="empty" class="empty" style="display:none">条件に合う作品がありません。</div>
</main>

<footer>
  K-DRAMA DATABASE — prototype
</footer>

const state = {year:"すべて", type:"すべて", tag:"すべて", q:""};

const years = [...new Set(dramas.map(x=>x.year))].sort((a,b)=>b.localeCompare(a));
const types = [...new Set(dramas.map(x=>x.type).filter(Boolean))];
const tags = [...new Set(dramas.flatMap(x=>x.tags))];

function makeButtons(id, values, key){
  const el = document.getElementById(id);
  el.innerHTML = "";
  const all = ["すべて", ...values];
  all.forEach(v=>{
    const b=document.createElement("button");
    b.textContent=v;
    if(state[key]===v)b.classList.add("active");
    b.onclick=()=>{state[key]=v; renderFilters(); render();};
    el.appendChild(b);
  });
}
function renderFilters(){
  makeButtons("yearFilters", years, "year");
  makeButtons("typeFilters", types, "type");
  makeButtons("tagFilters", tags, "tag");
}
function filtered(){
  return dramas.filter(d=>{
    const q=state.q.trim().toLowerCase();
    const okQ=!q || d.title.toLowerCase().includes(q);
    const okY=state.year==="すべて" || d.year===state.year;
    const okT=state.type==="すべて" || d.type===state.type;
    const okTag=state.tag==="すべて" || d.tags.includes(state.tag);
    return okQ&&okY&&okT&&okTag;
  });
}
function render(){
  const list=filtered();
  document.getElementById("count").textContent=`${list.length}作品`;
  const grid=document.getElementById("grid");
  const empty=document.getElementById("empty");
  grid.innerHTML="";
  empty.style.display=list.length?"none":"block";
  list.forEach(d=>{
    const card=document.createElement("article");
    card.className="card";
    card.innerHTML=`
      <div class="year">${escapeHtml(d.year)}</div>
      <div class="title">${escapeHtml(d.title)}</div>
      <div class="type">${escapeHtml(d.type||"作品")}</div>
      <div class="tags">${d.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>`;
    grid.appendChild(card);
  });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
const searchInput = document.getElementById("search");
const searchBtn = document.getElementById("searchBtn");

function doSearch(){
  state.q = searchInput.value;
  render();
}

searchInput.addEventListener("input", doSearch);
searchInput.addEventListener("change", doSearch);
searchInput.addEventListener("keyup", e => {
  if(e.key === "Enter") doSearch();
});
searchBtn.addEventListener("click", doSearch);

renderFilters();
render();
</script>
