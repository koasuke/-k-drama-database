.empty{padding:50px 10px;text-align:center;color:var(--muted)}

.note{margin-top:12px;color:#999;font-size:12px;line-height:1.6}

.detailOverlay{

.detailPanel{

.detailClose{

.detailMeta{font-size:13px;color:#77665d;line-height:1.7}

const types = [...new Set(dramas.map(x=>x.type).filter(Boolean))];
const tags = [...new Set(dramas.flatMap(x=>x.tags))];

function makeButtons(id, values, key){
  const el = document.getElementById(id);
  el.innerHTML = "";
  const all = ["すべて", ...values];
  all.forEach(v=>{
    const b=document.createElement("button");
    b.textContent=v;
    const isAll = v === "すべて";
    const isActive = isAll ? state[key].length === 0 : state[key].includes(v);
    if(isActive)b.classList.add("active");
    b.onclick=()=>{
      if(isAll) state[key]=[];
      else if(state[key].includes(v)) state[key]=state[key].filter(x=>x!==v);
      else state[key].push(v);
      renderFilters(); render();
    };
    el.appendChild(b);
  });
}
function renderFilters(){
  makeButtons("yearFilters", years, "year");
  makeButtons("typeFilters", types, "type");
  makeButtons("tagFilters", tags, "tag");
}
function filtered(){
  return dramas.filter(d=>{
    const q=state.q.trim().toLowerCase();

    const dramaYears=d.year.match(/\d{4}年/g)||[];
    const okY=state.year.length===0 || state.year.every(y=>dramaYears.includes(y));
    const okT=state.type.length===0 || state.type.every(t=>d.type===t);
    const okTag=state.tag.length===0 || state.tag.every(t=>d.tags.includes(t));
    return okQ&&okY&&okT&&okTag;
  });
}

  const empty=document.getElementById("empty");
  grid.innerHTML="";
  empty.style.display=list.length?"none":"block";
  list.forEach(d=>{
    const card=document.createElement("article");
    card.className="card";
    const poster = d.poster
      ? `<img class="poster" src="${escapeHtml(d.poster)}" alt="${escapeHtml(d.title)} ポスター" loading="lazy">`
      : `<div class="posterPlaceholder" data-poster-for="${escapeHtml(d.title)}">${tmdbExcluded.has(d.title) ? "画像なし" : "読込中…"}</div>`;
    card.innerHTML=`
      <div class="cardBody">
        ${poster}
        <div class="cardText">
          <div class="year">${escapeHtml(d.year)}</div>
          <div class="title">${escapeHtml(d.title)}</div>
          <div class="type">${escapeHtml(d.type||"作品")}</div>
          <div class="tags">${d.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>
        </div>
      </div>`;
    card.addEventListener("click",()=>openDetail(d));
    grid.appendChild(card);
  });
  list.forEach(loadPoster);
}

function firstYear(d){
  const m=String(d.year).match(/\d{4}/);
  return m ? Number(m[0]) : null;
}
function chooseBestTmdbResult(d, results){
  if(!Array.isArray(results)||!results.length)return null;
  const year=firstYear(d);
  const ranked=results.map(r=>{
    const ry=Number(String(r.first_air_date||r.release_date||"").slice(0,4))||null;
    let score=0;
    if(r.origin_country?.includes("KR")||r.original_language==="ko")score+=6;
    if(year&&ry===year)score+=5;
    if(r.poster_path)score+=2;
    return {r,score};
  }).sort((a,b)=>b.score-a.score);
  return ranked[0]?.score>=6 ? ranked[0].r : null;
}
async function loadPoster(d){
  if(d.poster||tmdbExcluded.has(d.title)||d.posterLoading)return;
  d.posterLoading=true;
  try{
    const fixed = tmdbFixed[d.title];
    const mediaType = fixed?.type || (d.type==="映画" ? "movie" : "tv");
    let response;
    let best;

    if(fixed){
      response = await fetch(`${TMDB_PROXY}?id=${fixed.id}&type=${mediaType}`);
      if(!response.ok) throw new Error(`HTTP ${response.status}`);
      best = await response.json();
    }else{
      const searchTitle = tmdbAliases[d.title] || d.title;
      response = await fetch(`${TMDB_PROXY}?query=${encodeURIComponent(searchTitle)}&type=${mediaType}`);
      if(!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      best = chooseBestTmdbResult(d,data.results);
    }
    if(best?.poster_path){
      d.poster=`${TMDB_IMAGE_BASE}${best.poster_path}`;
      d.tmdbId=best.id;
      document.querySelectorAll(`[data-poster-for="${CSS.escape(d.title)}"]`).forEach(el=>{
        const img=document.createElement("img");
        img.className="poster"; img.src=d.poster; img.alt=`${d.title} ポスター`; img.loading="lazy";
        el.replaceWith(img);
      });
    }else{
      document.querySelectorAll(`[data-poster-for="${CSS.escape(d.title)}"]`).forEach(el=>el.textContent="画像なし");
    }
  }catch(e){
    console.warn("TMDB poster load failed:",d.title,e);
    document.querySelectorAll(`[data-poster-for="${CSS.escape(d.title)}"]`).forEach(el=>el.textContent="取得失敗");
  }finally{ d.posterLoading=false; }
}

function hasHangul(text){
  return /[가-힣]/.test(text || "");
}

function displayCastName(person){
  const fixed = castNames[person.id];
  if(fixed){
    return fixed.ko ? `${fixed.ja} / ${fixed.ko}` : fixed.ja;
  }

  const name = (person.name || "").trim();
  const original = (person.original_name || "").trim();
  return original || name || "名前未登録";
}

async function fetchTmdbDetail(d){
  const fixed = tmdbFixed[d.title];
  const mediaType = fixed?.type || (d.type==="映画" ? "movie" : "tv");

  // IDがまだ保存されていない作品は、まず既存のポスター取得処理でIDを確定。
  if(!d.tmdbId && fixed?.id) d.tmdbId = fixed.id;
  if(!d.tmdbId) await loadPoster(d);

  if(!d.tmdbId) return null;

  const response = await fetch(`${TMDB_PROXY}?id=${d.tmdbId}&type=${mediaType}&credits=1`);
  if(!response.ok) throw new Error(`HTTP ${response.status}`);
  return await response.json();
}

function detailTags(d){
  return d.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("");
}

async function openDetail(d){
  const overlay=document.getElementById("detailOverlay");
  const content=document.getElementById("detailContent");
  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";

  content.innerHTML=`<div class="detailLoading">読み込み中…</div>`;

  try{
    const info=await fetchTmdbDetail(d);
    if(!info){
      content.innerHTML=`
        <div class="detailHero">
          ${d.poster ? `<img class="detailPoster" src="${escapeHtml(d.poster)}" alt="">` : `<div class="detailPosterPlaceholder">画像なし</div>`}
          <div class="detailInfo">
            <div class="detailYear">${escapeHtml(d.year)}</div>
            <div class="detailTitle">${escapeHtml(d.title)}</div>
            <div class="detailMeta">${escapeHtml(d.type||"作品")}</div>
          </div>
        </div>
        <div class="detailSection"><h3>タグ</h3><div class="tags">${detailTags(d)}</div></div>
        <div class="detailSection"><h3>あらすじ</h3><p>TMDBから詳細情報を取得できませんでした。</p></div>`;
      return;
    }

    const poster=info.poster_path ? `${TMDB_IMAGE_BASE}${info.poster_path}` : d.poster;
    const genres=(info.genres||[]).map(g=>g.name).filter(Boolean).join("・");
    const episodes=info.number_of_episodes ? `${info.number_of_episodes}話` : "";
    const seasons=info.number_of_seasons && info.number_of_seasons>1 ? `${info.number_of_seasons}シーズン` : "";
    const runtime=Array.isArray(info.episode_run_time) && info.episode_run_time[0] ? `1話 約${info.episode_run_time[0]}分` : "";
    const meta=[d.type||"作品", genres, seasons, episodes, runtime].filter(Boolean).join(" ｜ ");
    const overview=(info.overview||"").trim();
    const cast=(info.credits?.cast||[]).slice(0,8).filter(c=>c.name||c.original_name);

    content.innerHTML=`
      <div class="detailHero">
        ${poster ? `<img class="detailPoster" src="${escapeHtml(poster)}" alt="${escapeHtml(d.title)} ポスター">` : `<div class="detailPosterPlaceholder">画像なし</div>`}
        <div class="detailInfo">
          <div class="detailYear">${escapeHtml(d.year)}</div>
          <div class="detailTitle">${escapeHtml(d.title)}</div>
          <div class="detailMeta">${escapeHtml(meta)}</div>
        </div>
      </div>

      <div class="detailSection">
        <h3>あらすじ</h3>
        <p>${overview ? escapeHtml(overview) : "日本語のあらすじはまだ登録されていません。"}</p>
      </div>

      ${cast.length ? `
      <div class="detailSection">
        <h3>出演</h3>
        <div class="detailCast">${cast.map(person=>`<span>${escapeHtml(displayCastName(person))}</span>`).join("")}</div>
      </div>` : ""}

      <div class="detailSection">
        <h3>この作品のタグ</h3>
        <div class="tags">${detailTags(d)}</div>
      </div>`;
  }catch(e){
    console.warn("detail load failed:",d.title,e);
    content.innerHTML=`<div class="detailLoading">詳細情報の取得に失敗しました。</div>`;
  }
}

function closeDetail(){
  const overlay=document.getElementById("detailOverlay");
  overlay.classList.remove("open");
  overlay.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
}

document.getElementById("detailClose").addEventListener("click",closeDetail);
document.getElementById("detailOverlay").addEventListener("click",e=>{
  if(e.target.id==="detailOverlay") closeDetail();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeDetail();
});

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
const searchInput = document.getElementById("search");
const searchBtn = document.getElementById("searchBtn");

function doSearch(){
  state.q = searchInput.value;
  render();
}

searchInput.addEventListener("input", doSearch);
searchInput.addEventListener("change", doSearch);
searchInput.addEventListener("keyup", e => {
  if(e.key === "Enter") doSearch();
});
searchBtn.addEventListener("click", doSearch);

renderFilters();
render();
</script>
